[build-system]
requires=["setuptools>=64"]
build-backend="setuptools.build_meta"

[project]
name="clockloom-audio"
version="1.0.0"
description="Estimate and correct independent recorder clocks with auditable acoustic landmarks"
readme="README.md"
requires-python=">=3.10"
dependencies=["numpy>=1.24,<3","scipy>=1.10,<2"]

[project.scripts]
clockloom="clockloom.cli:main"

[tool.setuptools]
packages=["clockloom"]
